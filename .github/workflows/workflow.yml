name: workflow.yml
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: install-dependencies
        run: pip install -r requirements.txt
      - name: test
        run: python3 main.py